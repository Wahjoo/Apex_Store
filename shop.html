<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX | Shop Product Catalog</title>
  <meta name="description" content="Filter, search, and sort all products on APEX Store." />
  
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/80 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20 gap-4">
        
        <a href="index.html" class="flex items-center gap-2.5 group flex-shrink-0">
          <div class="w-11 h-11 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-md shadow-indigo-200 group-hover:scale-105 transition">
            A
          </div>
          <div class="flex flex-col">
            <span class="font-extrabold text-xl tracking-tight text-slate-900 leading-none group-hover:text-indigo-600 transition">APEX</span>
            <span class="text-[10px] font-bold uppercase tracking-widest text-indigo-600">STORE</span>
          </div>
        </a>

        <!-- Header Search Bar -->
        <div id="search-container" class="relative flex-1 max-w-md hidden md:block">
          <div class="relative">
            <input type="text" id="header-search-input" placeholder="Search products..." class="w-full bg-slate-100/90 border border-slate-200 rounded-2xl py-2.5 pl-11 pr-4 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />
            <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <div id="search-results-dropdown" class="absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl border border-slate-200 shadow-2xl overflow-hidden z-50 hidden"></div>
        </div>

        <nav class="hidden lg:flex items-center gap-8">
          <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition">Home</a>
          <a href="shop.html" class="text-sm font-bold text-indigo-600">Shop</a>
          <a href="about.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition">About</a>
          <a href="contact.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition">Contact</a>
        </nav>

        <div class="flex items-center gap-4">
          <a href="cart.html" class="relative p-3 rounded-2xl bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 transition flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="cart-count-badge absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-md hidden">0</span>
          </a>

          <button id="mobile-menu-btn" class="lg:hidden p-3 rounded-2xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- SHOP CONTENT -->
  <main class="flex-grow py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
      
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900">Explore Product Catalog</h1>
        <p class="text-slate-500 text-sm">Filter, search, and sort products fetched live from Platzi API</p>
      </div>

      <!-- Filter Controls Bar -->
      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Search Keywords</label>
            <div class="relative">
              <input type="text" id="shop-search-input" placeholder="Type product title..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" />
              <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Sort By</label>
            <select id="shop-sort-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
              <option value="featured">Featured / Default</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="title">Alphabetical (A-Z)</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-xs font-bold text-slate-600">Max Price</label>
              <span id="price-range-value" class="text-xs font-extrabold text-indigo-600">$1000</span>
            </div>
            <input type="range" id="price-range-slider" min="10" max="1000" step="10" value="1000" class="w-full accent-indigo-600 cursor-pointer" />
          </div>
        </div>
      </div>

      <!-- Shop Grid & Sidebar -->
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Category Sidebar -->
        <div class="lg:col-span-1 space-y-6">
          <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-900 text-base border-b border-slate-100 pb-3">Categories</h3>
            <ul id="shop-category-list" class="space-y-1">
              <!-- JS Populated -->
            </ul>
          </div>
        </div>

        <!-- Products Grid -->
        <div class="lg:col-span-3 space-y-6">
          <div class="flex justify-between items-center text-xs font-semibold text-slate-500">
            <span id="shop-results-count">Showing 0 items</span>
            <button onclick="resetShopFilters()" class="text-indigo-600 hover:text-indigo-700 underline">Clear All Filters</button>
          </div>
          <div id="shop-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS Populated by shop.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <p>&copy; 2026 APEX Store. All Rights Reserved.</p>
      <div class="flex gap-3 text-slate-400">
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="Instagram">
          <i class="fa-brands fa-instagram text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="YouTube">
          <i class="fa-brands fa-youtube text-xs"></i>
        </a>
      </div>
    </div>
  </footer>

  <!-- JavaScript Modules -->
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
