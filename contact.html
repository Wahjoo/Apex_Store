<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX | Contact Us</title>
  <meta name="description" content="Get in touch with the APEX Store customer support team." />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-2.5">
          <div class="w-11 h-11 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-md">A</div>
          <span class="font-extrabold text-xl tracking-tight text-slate-900">APEX STORE</span>
        </a>
        <nav class="hidden lg:flex items-center gap-8">
          <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">Home</a>
          <a href="shop.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">Shop</a>
          <a href="about.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">About</a>
          <a href="contact.html" class="text-sm font-bold text-indigo-600">Contact</a>
        </nav>
        <a href="cart.html" class="relative p-3 rounded-2xl bg-slate-100 text-slate-700 hover:text-indigo-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
          <span class="cart-count-badge absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-md hidden">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow py-16">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
      <div class="text-center space-y-3">
        <h1 class="text-4xl font-extrabold text-slate-900">Get in Touch</h1>
        <p class="text-slate-500 text-base">Have questions or feedback? Our team responds within 24 hours.</p>
      </div>

      <div class="bg-white p-8 sm:p-12 rounded-3xl border border-slate-100 shadow-sm">
        <form onsubmit="event.preventDefault(); showToast('Thank you! Your message has been sent.'); this.reset();" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Your Name</label>
              <input type="text" required placeholder="Alex Smith" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
              <input type="email" required placeholder="alex@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Subject</label>
            <input type="text" required placeholder="Order inquiry / Feedback" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Message</label>
            <textarea required rows="4" placeholder="How can we assist you today?" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
          <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold transition">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <p>&copy; 2026 APEX Store. All Rights Reserved.</p>
      <div class="flex gap-3 text-slate-400">
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="Instagram">
          <i class="fa-brands fa-instagram text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in text-xs"></i>
        </a>
        <a href="#" class="w-8 h-8 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition" aria-label="YouTube">
          <i class="fa-brands fa-youtube text-xs"></i>
        </a>
      </div>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
